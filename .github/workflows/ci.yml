name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: ledger_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap
          POSTGRES_DB: ledgercore_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ledger_bootstrap -d ledgercore_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGPASSWORD: ci-bootstrap
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      POSTGRES_USER: ledger_bootstrap
      POSTGRES_DB: ledgercore_test
      LEDGER_MIGRATOR_PASSWORD: ci-migrator
      LEDGER_APP_PASSWORD: ci-app
      LEDGER_FIXTURE_PASSWORD: ci-fixture
      LEDGER_REQUIRE_INTEGRATION: "1"
      LEDGER_TEST_ADMIN_URL: postgres://ledger_migrator:ci-migrator@127.0.0.1:5432/ledgercore_test?sslmode=disable
      LEDGER_TEST_DATABASE_URL: postgres://ledger_app:ci-app@127.0.0.1:5432/ledgercore_test?sslmode=disable
      LEDGER_TEST_FIXTURE_URL: postgres://ledger_fixture:ci-fixture@127.0.0.1:5432/ledgercore_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.2"
          cache: true
      - name: Prepare separate database roles
        run: sh scripts/bootstrap-db.sh
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal migrations tests)"
      - name: Unit tests with race detector
        run: make test
      - name: Required real PostgreSQL integration tests with race detector
        run: make test-integration-local
      - name: Vet and Staticcheck
        run: make lint
      - name: Build
        run: make build
      - name: Validate Compose and build non-root image
        run: |
          docker compose --profile tools --profile test config --quiet
          docker build --target runtime -t ledgercore:ci .
