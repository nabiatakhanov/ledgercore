name: ledgercore-events

x-runtime: &runtime
  image: ledgercore:events-local
  build:
    context: .
    target: runtime
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 1.0
  stop_grace_period: 15s

x-gateway-env: &gateway-env
  API_TOKEN: ${API_TOKEN:-ledger-local-demo-token-change-me}
  INTERNAL_RPC_TOKEN: ${INTERNAL_RPC_TOKEN:-ledger-local-private-rpc-token-change-me}
  LEDGER_GRPC_TARGET: ledger:50051
  ACTIVITY_GRPC_TARGET: activity:50052
  REDIS_ADDR: redis:6379
  RATE_LIMIT: ${RATE_LIMIT:-60}
  RATE_WINDOW: ${RATE_WINDOW:-1m}
  HTTP_ADDR: :8080
  METRICS_ADDR: :9090

services:
  db:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment:
      POSTGRES_USER: ledger_bootstrap
      POSTGRES_DB: ledgercore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger-local-bootstrap-only}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      LEDGER_MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:-ledger-local-migrator-only}
      LEDGER_APP_PASSWORD: ${APP_PASSWORD:-ledger-local-app-only}
      LEDGER_FIXTURE_PASSWORD: ${FIXTURE_PASSWORD:-ledger-local-fixture-only}
      LEDGER_PUBLISHER_PASSWORD: ${PUBLISHER_PASSWORD:-ledger-local-publisher-only}
      ACTIVITY_MIGRATOR_PASSWORD: ${ACTIVITY_MIGRATOR_PASSWORD:-activity-local-migrator-only}
      ACTIVITY_APP_PASSWORD: ${ACTIVITY_APP_PASSWORD:-activity-local-app-only}
    command: [postgres, -c, max_connections=200, -c, track_commit_timestamp=on]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/bootstrap-db.sh:/docker-entrypoint-initdb.d/10-ledger-roles.sh:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, ledger_bootstrap, -d, ledgercore]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s

  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 2097152
      KAFKA_REPLICA_FETCH_MAX_BYTES: 3145728
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, 'KAFKA_HEAP_OPTS="-Xms32m -Xmx96m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1']
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 10s
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s

  kafka-init:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        for topic in "$${KAFKA_TOPIC}" "$${KAFKA_DLQ_TOPIC}"; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 --config max.message.bytes=2097152
        done
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ledger.operations.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-ledger.operations.dlq.v1}
      KAFKA_HEAP_OPTS: -Xms32m -Xmx96m
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1.0

  redis:
    image: redis:8.2.11-bookworm@sha256:99ffb973380cc2f47bca06bd094f7f8c7138a0879a63cb8939896a22b7a65bba
    command: [redis-server, --bind, 0.0.0.0, --protected-mode, "no", --appendonly, "yes", --appendfsync, everysec, --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20
    mem_limit: 256m
    cpus: 1.0

  migrate:
    <<: *runtime
    entrypoint: [/app/ledgerctl]
    command: [migrate]
    environment:
      MIGRATION_DATABASE_URL: postgres://ledger_migrator:${MIGRATOR_PASSWORD:-ledger-local-migrator-only}@db:5432/ledgercore?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  migrate-activity:
    <<: *runtime
    entrypoint: [/app/activity]
    command: [migrate]
    environment:
      ACTIVITY_MIGRATION_DATABASE_URL: postgres://activity_migrator:${ACTIVITY_MIGRATOR_PASSWORD:-activity-local-migrator-only}@db:5432/activity?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  ledger:
    <<: *runtime
    command: [/app/ledger]
    environment:
      DATABASE_URL: postgres://ledger_app:${APP_PASSWORD:-ledger-local-app-only}@db:5432/ledgercore?sslmode=disable
      INTERNAL_RPC_TOKEN: ${INTERNAL_RPC_TOKEN:-ledger-local-private-rpc-token-change-me}
      GRPC_ADDR: :50051
      METRICS_ADDR: :9091
      DB_MAX_CONNS: ${DB_MAX_CONNS:-16}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /app/ledger, health]
      interval: 5s
      timeout: 3s
      retries: 12

  publisher:
    <<: *runtime
    command: [/app/publisher]
    environment:
      PUBLISHER_DATABASE_URL: postgres://ledger_publisher:${PUBLISHER_PASSWORD:-ledger-local-publisher-only}@db:5432/ledgercore?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ledger.operations.v1}
      METRICS_ADDR: :9092
      HEALTH_PORT: 9092
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /bin/bash, /app/healthcheck.sh]
      interval: 5s
      timeout: 3s
      retries: 12

  activity:
    <<: *runtime
    command: [/app/activity]
    environment:
      ACTIVITY_DATABASE_URL: postgres://activity_app:${ACTIVITY_APP_PASSWORD:-activity-local-app-only}@db:5432/activity?sslmode=disable
      INTERNAL_RPC_TOKEN: ${INTERNAL_RPC_TOKEN:-ledger-local-private-rpc-token-change-me}
      ACTIVITY_GRPC_ADDR: :50052
      ACTIVITY_METRICS_ADDR: :9093
      HEALTH_PORT: 9093
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ledger.operations.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-ledger.operations.dlq.v1}
      ACTIVITY_GROUP_ID: ${ACTIVITY_GROUP_ID:-activity-v1}
      ACTIVITY_PARTITION_CONCURRENCY: 3
    depends_on:
      migrate-activity:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /bin/bash, /app/healthcheck.sh]
      interval: 5s
      timeout: 3s
      retries: 12

  gateway:
    <<: *runtime
    command: [/app/gateway]
    environment: *gateway-env
    ports:
      - 127.0.0.1:${HTTP_PORT:-18080}:8080
      - 127.0.0.1:${METRICS_PORT:-19090}:9090
    depends_on:
      ledger:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, /bin/bash, /app/healthcheck.sh]
      interval: 5s
      timeout: 3s
      retries: 12

  gateway2:
    <<: *runtime
    command: [/app/gateway]
    environment: *gateway-env
    ports:
      - 127.0.0.1:${HTTP_PORT_2:-18081}:8080
      - 127.0.0.1:${METRICS_PORT_2:-19091}:9090
    depends_on:
      ledger:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, /bin/bash, /app/healthcheck.sh]
      interval: 5s
      timeout: 3s
      retries: 12

  ledgerctl:
    <<: *runtime
    profiles: [tools]
    entrypoint: [/app/ledgerctl]
    command: [reconcile]
    environment:
      DATABASE_URL: postgres://ledger_app:${APP_PASSWORD:-ledger-local-app-only}@db:5432/ledgercore?sslmode=disable
      FIXTURE_DATABASE_URL: postgres://ledger_fixture:${FIXTURE_PASSWORD:-ledger-local-fixture-only}@db:5432/ledgercore?sslmode=disable
      ACTIVITY_DATABASE_URL: postgres://activity_app:${ACTIVITY_APP_PASSWORD:-activity-local-app-only}@db:5432/activity?sslmode=disable
      API_TOKEN: ${API_TOKEN:-ledger-local-demo-token-change-me}
      INTERNAL_RPC_TOKEN: ${INTERNAL_RPC_TOKEN:-ledger-local-private-rpc-token-change-me}
      API_URL: http://gateway:8080
      API_URL_2: http://gateway2:8080
      GATEWAY2_URL: http://gateway2:8080
      METRICS_URL: http://gateway:9090/metrics
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ledger.operations.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-ledger.operations.dlq.v1}
      ACTIVITY_GROUP_ID: ${ACTIVITY_GROUP_ID:-activity-v1}
    depends_on:
      gateway:
        condition: service_healthy
      gateway2:
        condition: service_healthy

  api-compat:
    <<: *runtime
    profiles: [compat]
    command: [/app/api]
    environment:
      DATABASE_URL: postgres://ledger_app:${APP_PASSWORD:-ledger-local-app-only}@db:5432/ledgercore?sslmode=disable
      API_TOKEN: ${API_TOKEN:-ledger-local-demo-token-change-me}
      HTTP_ADDR: :8080
      METRICS_ADDR: :9090
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /bin/bash, /app/healthcheck.sh]
      interval: 5s
      timeout: 3s
      retries: 12

  ledgerctl-legacy:
    <<: *runtime
    profiles: [compat]
    entrypoint: [/app/ledgerctl]
    command: [demo]
    environment:
      DATABASE_URL: postgres://ledger_app:${APP_PASSWORD:-ledger-local-app-only}@db:5432/ledgercore?sslmode=disable
      FIXTURE_DATABASE_URL: postgres://ledger_fixture:${FIXTURE_PASSWORD:-ledger-local-fixture-only}@db:5432/ledgercore?sslmode=disable
      API_TOKEN: ${API_TOKEN:-ledger-local-demo-token-change-me}
      API_URL: http://api-compat:8080
      METRICS_URL: http://api-compat:9090/metrics
    depends_on:
      api-compat:
        condition: service_healthy

  integration:
    profiles: [test]
    image: ledgercore:events-integration-local
    build:
      context: .
      target: integration
    environment:
      LEDGER_REQUIRE_INTEGRATION: "1"
      LEDGER_REQUIRE_EVENTS_INTEGRATION: "1"
      LEDGER_TEST_ADMIN_URL: postgres://ledger_migrator:${MIGRATOR_PASSWORD:-ledger-local-migrator-only}@db:5432/ledgercore_test?sslmode=disable
      LEDGER_TEST_DATABASE_URL: postgres://ledger_app:${APP_PASSWORD:-ledger-local-app-only}@db:5432/ledgercore_test?sslmode=disable
      LEDGER_TEST_FIXTURE_URL: postgres://ledger_fixture:${FIXTURE_PASSWORD:-ledger-local-fixture-only}@db:5432/ledgercore_test?sslmode=disable
      ACTIVITY_TEST_DATABASE_URL: postgres://activity_app:${ACTIVITY_APP_PASSWORD:-activity-local-app-only}@db:5432/activity_events_test?sslmode=disable
      ACTIVITY_TEST_MIGRATION_URL: postgres://activity_migrator:${ACTIVITY_MIGRATOR_PASSWORD:-activity-local-migrator-only}@db:5432/activity_events_test?sslmode=disable
      EVENTS_TEST_LEDGER_URL: postgres://ledger_app:${APP_PASSWORD:-ledger-local-app-only}@db:5432/ledgercore_events_test?sslmode=disable
      EVENTS_TEST_LEDGER_ADMIN_URL: postgres://ledger_migrator:${MIGRATOR_PASSWORD:-ledger-local-migrator-only}@db:5432/ledgercore_events_test?sslmode=disable
      EVENTS_TEST_FIXTURE_URL: postgres://ledger_fixture:${FIXTURE_PASSWORD:-ledger-local-fixture-only}@db:5432/ledgercore_events_test?sslmode=disable
      EVENTS_TEST_PUBLISHER_URL: postgres://ledger_publisher:${PUBLISHER_PASSWORD:-ledger-local-publisher-only}@db:5432/ledgercore_events_test?sslmode=disable
      EVENTS_TEST_ACTIVITY_URL: postgres://activity_app:${ACTIVITY_APP_PASSWORD:-activity-local-app-only}@db:5432/activity_events_test?sslmode=disable
      EVENTS_TEST_ACTIVITY_ADMIN_URL: postgres://activity_migrator:${ACTIVITY_MIGRATOR_PASSWORD:-activity-local-migrator-only}@db:5432/activity_events_test?sslmode=disable
      EVENTS_E2E_TEST_DATABASE_URL: postgres://ledger_app:${APP_PASSWORD:-ledger-local-app-only}@db:5432/ledger_events_e2e_test?sslmode=disable
      EVENTS_E2E_TEST_MIGRATION_URL: postgres://ledger_migrator:${MIGRATOR_PASSWORD:-ledger-local-migrator-only}@db:5432/ledger_events_e2e_test?sslmode=disable
      EVENTS_E2E_TEST_FIXTURE_URL: postgres://ledger_fixture:${FIXTURE_PASSWORD:-ledger-local-fixture-only}@db:5432/ledger_events_e2e_test?sslmode=disable
      EVENTS_E2E_TEST_PUBLISHER_URL: postgres://ledger_publisher:${PUBLISHER_PASSWORD:-ledger-local-publisher-only}@db:5432/ledger_events_e2e_test?sslmode=disable
      EVENTS_E2E_TEST_ACTIVITY_DATABASE_URL: postgres://activity_app:${ACTIVITY_APP_PASSWORD:-activity-local-app-only}@db:5432/activity_events_e2e_test?sslmode=disable
      EVENTS_E2E_TEST_ACTIVITY_MIGRATION_URL: postgres://activity_migrator:${ACTIVITY_MIGRATOR_PASSWORD:-activity-local-migrator-only}@db:5432/activity_events_e2e_test?sslmode=disable
      EVENTS_TEST_KAFKA_BROKERS: kafka:9092
      KAFKA_TEST_BROKERS: kafka:9092
      EVENTS_TEST_REDIS_ADDR: redis:6379
      LEDGER_TEST_REDIS_ADDR: redis:6379
      REDIS_ADDR: redis:6379
      INTERNAL_RPC_TOKEN: integration-private-rpc-token
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - test-build-cache:/root/.cache/go-build

volumes:
  pgdata:
  kafka-data:
  redis-data:
  test-build-cache:
