syntax = "proto3";
package ledger.v1;
option go_package = "ledgercore/gen/ledger/v1;ledgerv1";
import "google/protobuf/timestamp.proto";

// Field numbers are permanent: reserve numbers/names when removing fields.
// All monetary integers are kopecks in RUB; operation amounts must be positive.
service LedgerService {
  rpc CreateTransfer(CreateTransferRequest) returns (OperationResponse);
  rpc GetTransfer(GetTransferRequest) returns (GetTransferResponse);
  rpc ReverseTransfer(ReverseTransferRequest) returns (OperationResponse);
  rpc CreateAccount(CreateAccountRequest) returns (Account);
  rpc GetAccount(GetAccountRequest) returns (Account);
  rpc GetAccountEntries(GetAccountEntriesRequest) returns (GetAccountEntriesResponse);
}
message CreateTransferRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  int64 amount_minor = 3;
  string currency = 4;
  map<string,string> metadata = 5;
  string idempotency_key = 6;
}
message ReverseTransferRequest { string id = 1; string idempotency_key = 2; }
message GetTransferRequest { string id = 1; }
message GetTransferResponse { Transaction transaction = 1; }
message OperationResponse { Transaction transaction = 1; bool replayed = 2; }
message Transaction {
  string id = 1;
  string kind = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  int64 amount_minor = 5;
  string currency = 6;
  map<string,string> metadata = 7;
  string reversal_of = 8;
  google.protobuf.Timestamp created_at = 9;
  repeated Posting postings = 10;
}
message Posting {
  string transaction_id = 1;
  string account_id = 2;
  int64 delta_minor = 3;
  int64 sequence = 4;
  google.protobuf.Timestamp created_at = 5;
}
message CreateAccountRequest { string name = 1; }
message GetAccountRequest { string id = 1; }
message Account {
  string id = 1;
  string name = 2;
  string kind = 3;
  string currency = 4;
  int64 balance_minor = 5;
  google.protobuf.Timestamp created_at = 6;
}
message GetAccountEntriesRequest { string account_id = 1; string cursor = 2; int32 limit = 3; }
message GetAccountEntriesResponse { repeated Posting entries = 1; string next_cursor = 2; }
